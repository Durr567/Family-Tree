<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Tree</title>
<style>
:root{--bg:#eef0ea;--dot:#c9cdc2;--card:#fff;--ink:#1f2a25;--mut:#6b746e;--acc:#2f6f5e;--ln:#7d857f;--bd:#cfd4cb}
@media(prefers-color-scheme:dark){:root{--bg:#171a18;--dot:#2c322e;--card:#252a27;--ink:#e9ede8;--mut:#98a29b;--acc:#5fb59d;--ln:#8a938c;--bd:#3a423d}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 "Iowan Old Style",Georgia,serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc)}
#bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--card);flex-wrap:wrap}
#bar h1{font-size:17px;margin:0 8px 0 0;font-weight:600}#st{margin-left:auto;color:var(--mut);font-size:12px}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
svg path{fill:none;stroke:var(--ln);stroke-width:2}svg .pt{stroke:var(--acc);stroke-dasharray:6 4}#tmp{stroke:var(--acc)}
.node{position:absolute;display:flex;gap:8px;align-items:center;padding:8px;background:var(--card);border:1.5px solid var(--bd);border-radius:8px;cursor:move;user-select:none}
.node.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.node.hot{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.ph{flex:none;width:48px;height:48px;border-radius:50%;background:var(--bd) center/cover;display:grid;place-items:center;font-size:20px;color:var(--mut)}
.tx{min-width:0;display:flex;flex-direction:column}.tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx small{color:var(--mut)}
.port{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid var(--card);opacity:0;cursor:crosshair;transition:opacity .15s}
.node:hover .port,.node.sel .port{opacity:1}
.port.t{left:calc(50% - 7px);top:-8px}.port.b{left:calc(50% - 7px);bottom:-8px}.port.l{left:-8px;top:calc(50% - 7px)}.port.r{right:-8px;top:calc(50% - 7px)}
#panel{width:290px;flex:none;border-left:1px solid var(--bd);background:var(--card);padding:12px;overflow:auto}
#panel label{display:block;margin-top:8px;color:var(--mut);font-size:12px}
#panel input[type=text],#panel textarea{width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg)}
#panel textarea{min-height:110px;resize:vertical}.row{display:flex;gap:6px}.row>div{flex:1}
.rel{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--bd)}
.rel button{padding:0 7px}.empty{color:var(--mut)}
#lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9}
#lock div{text-align:center}#lock input{font-size:28px;width:150px;text-align:center;letter-spacing:.3em;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
@media(max-width:700px){#panel{position:absolute;right:0;bottom:0;top:auto;width:100%;max-height:45%;border-top:1px solid var(--bd)}}
</style></head><body>
<div id="lock"><div><h2>Family Tree</h2><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" autofocus><p id="pe" class="empty"></p></div></div>
<div id="bar"><h1>Family Tree</h1>
<button id="add">Add person</button><button id="zo" title="Zoom out">−</button><button id="zi" title="Zoom in">+</button><button id="fit">Fit</button>
<button id="ex">Export</button><button id="im">Import</button><button id="gh">GitHub sync</button><span id="st"></span></div>
<div id="main"><div id="stage"><div id="world"><svg id="ln"></svg><svg><path id="tmp"/></svg></div></div><aside id="panel"></aside></div>
<input id="file" type="file" hidden><input id="pf" type="file" accept="image/*" hidden>
<script>
// ---- CONFIG: set your repo once so family only need the link ----
const REPO="YOUR-USER/YOUR-REPO", FILE="tree.json", PIN_HASH="b192c9bbefcbd7b0c7bf0d22de062086cc167f80d5287c2351a5748ad3a085fd";
const W=170,H=72,G=20,$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
let conn=null,D={people:[],rels:[]},V={x:60,y:60,k:1},sel=null,drag=null,sha=null,timer=null;
let cfg=JSON.parse(localStorage.getItem('ft-gh')||'{}');
const stage=$('#stage'),world=$('#world'),svg=$('#ln'),tmp=$('#tmp'),person=id=>D.people.find(p=>p.id==id);
const st=t=>$('#st').textContent=t;

// ---- PIN gate (client-side deterrent only) ----
async function hash(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function tryPin(){const v=$('#pin').value;if(v.length<4)return;if(await hash(v)==PIN_HASH){sessionStorage.setItem('ft-ok','1');$('#lock').remove();start()}else{$('#pe').textContent='Wrong PIN';$('#pin').value=''}}
$('#pin').oninput=tryPin;
if(sessionStorage.getItem('ft-ok')){$('#lock').remove();start()}

// ---- storage ----
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s)));
const repo=()=>cfg.repo||REPO,hd=()=>({Accept:'application/vnd.github+json',...(cfg.token?{Authorization:'Bearer '+cfg.token}:{})});
const url=()=>`https://api.github.com/repos/${repo()}/contents/${FILE}`;
async function start(){
  try{D=JSON.parse(localStorage.getItem('ft-data'))||D}catch{}
  if(!repo().startsWith('YOUR-')){try{const r=await fetch(url()+'?t='+Date.now(),{headers:hd()});
    if(r.ok){const j=await r.json();sha=j.sha;D=JSON.parse(dec(j.content));st(cfg.token?'Loaded from GitHub':'Loaded – read only (no token)')}else if(r.status!=404)st('GitHub load failed ('+r.status+')')}catch{st('Offline – using local copy')}}
  else st('Local only – set repo in GitHub sync');
  render();if(D.people.length)fit();
}
function save(){localStorage.setItem('ft-data',JSON.stringify(D));if(cfg.token&&!repo().startsWith('YOUR-')){st('Saving…');clearTimeout(timer);timer=setTimeout(push,1500)}}
async function push(){try{const r=await fetch(url(),{method:'PUT',headers:hd(),body:JSON.stringify({message:'Update family tree',content:enc(JSON.stringify(D)),sha:sha||undefined})});
  if(r.ok){sha=(await r.json()).content.sha;st('Saved to GitHub')}else st(r.status==409||r.status==422?'Conflict – someone else saved. Reload the page.':'Save failed ('+r.status+')')}catch{st('Save failed (offline)')}}
$('#gh').onclick=()=>{const r=prompt('GitHub repo (owner/name):',repo());if(r===null)return;
  const t=prompt('Fine-grained token with Contents: read/write on this repo (leave empty for read-only):',cfg.token||'');
  cfg={repo:r.trim(),token:(t||'').trim()};localStorage.setItem('ft-gh',JSON.stringify(cfg));location.reload()};

// ---- geometry ----
const pos=(id,q)=>{const p=person(id);return q=='t'?[p.x+W/2,p.y]:q=='b'?[p.x+W/2,p.y+H]:q=='l'?[p.x,p.y+H/2]:[p.x+W,p.y+H/2]};
function lines(){let s='';for(const r of D.rels){const A=person(r.a),B=person(r.b);if(!A||!B)continue;
  if(r.t=='p'){const[x2,y2]=pos(r.b,'t');
    const o=D.rels.filter(q=>q.t=='p'&&q.b==r.b&&q.a!=r.a).map(q=>q.a).find(id=>person(id)&&D.rels.some(q=>q.t=='s'&&((q.a==r.a&&q.b==id)||(q.b==r.a&&q.a==id))));
    if(o){if(r.a>o)continue;const O=person(o),[L,R]=A.x<O.x?[A,O]:[O,A],sx=(L.x+W+R.x)/2,sy=(L.y+R.y)/2+H/2,bot=Math.max(A.y,O.y)+H,m=y2>bot?(bot+y2)/2:(sy+y2)/2;
      s+=`<path d="M${sx} ${sy}V${m}H${x2}V${y2}"/>`} // from between both parents
    else{const[x1,y1]=pos(r.a,'b'),m=(y1+y2)/2;s+=`<path d="M${x1} ${y1}V${m}H${x2}V${y2}"/>`}}
  else{const[L,R]=A.x<B.x?[A,B]:[B,A];s+=`<path class="pt" d="M${L.x+W} ${L.y+H/2}L${R.x} ${R.y+H/2}"/>`}}svg.innerHTML=s}
function view(){world.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.k})`;const g=G*V.k;stage.style.background=`radial-gradient(var(--dot) 1.2px,transparent 1.5px) ${V.x}px ${V.y}px/${g}px ${g}px`}
const toW=e=>{const r=stage.getBoundingClientRect();return[(e.clientX-r.left-V.x)/V.k,(e.clientY-r.top-V.y)/V.k]};
function zoom(f,cx,cy){const r=stage.getBoundingClientRect();cx=(cx??r.left+r.width/2)-r.left;cy=(cy??r.top+r.height/2)-r.top;
  const k=Math.min(2.5,Math.max(.2,V.k*f));f=k/V.k;V.x=cx-(cx-V.x)*f;V.y=cy-(cy-V.y)*f;V.k=k;view()}
function fit(){if(!D.people.length)return;const r=stage.getBoundingClientRect(),xs=D.people.map(p=>p.x),ys=D.people.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs)+W,y0=Math.min(...ys),y1=Math.max(...ys)+H;
  V.k=Math.min(1.2,(r.width-80)/(x1-x0),(r.height-80)/(y1-y0));V.x=(r.width-(x1-x0)*V.k)/2-x0*V.k;V.y=(r.height-(y1-y0)*V.k)/2-y0*V.k;view()}

// ---- render ----
function render(){world.querySelectorAll('.node').forEach(n=>n.remove());
  for(const p of D.people){const n=document.createElement('div');n.className='node'+(p.id==sel?' sel':'');n.dataset.id=p.id;
    n.style.cssText=`left:${p.x}px;top:${p.y}px;width:${W}px;height:${H}px`;
    const ph=document.createElement('div');ph.className='ph';
    if(p.photo&&p.photo.startsWith('data:image/'))ph.style.backgroundImage=`url("${p.photo}")`;else ph.textContent=(p.name||'?')[0];
    const t=document.createElement('div');t.className='tx';const b=document.createElement('b');b.textContent=p.name||'Unnamed';
    const s=document.createElement('small');s.textContent=(p.born||'')+(p.died?' – '+p.died:'');t.append(b,s);n.append(ph,t);
    for(const q of['t','b','l','r']){const d=document.createElement('i');d.className='port '+q;d.dataset.p=q;n.append(d)}world.append(n)}
  lines();view();panel()}
const F=[['name','Name'],['born','Born (date)'],['bornPlace','Birth place'],['died','Died (date)'],['diedPlace','Death place']];
function panel(){const el=$('#panel'),p=person(sel);
  if(!p){el.innerHTML='<p class="empty">Select a person to edit details, or press Add person.<br><br>Drag from a dot on a box onto another box to connect: top dot = parent, bottom dot = child, side dot = partner.</p>';return}
  el.innerHTML='';const mk=(f,l,area)=>{const lb=document.createElement('label');lb.textContent=l;const i=document.createElement(area?'textarea':'input');if(!area)i.type='text';
    i.value=p[f]||'';i.oninput=()=>{p[f]=i.value;localStorage.setItem('ft-data',JSON.stringify(D))};i.onchange=()=>{save();render()};lb.append(i);return lb};
  el.append(mk('name','Name'));const r=document.createElement('div');r.className='row';
  for(const[f,l]of F.slice(1,3)){}
  el.append(mk('born','Born (date)'),mk('bornPlace','Birth place'),mk('died','Died (date)'),mk('diedPlace','Death place'),mk('notes','Notes and extra info',1));
  const pb=document.createElement('button');pb.textContent=p.photo?'Change photo':'Add photo';pb.style.marginTop='10px';pb.onclick=()=>$('#pf').click();el.append(pb);
  if(p.photo){const rb=document.createElement('button');rb.textContent='Remove photo';rb.onclick=()=>{delete p.photo;save();render()};el.append(' ',rb)}
  const h=document.createElement('h4');h.textContent='Connections';el.append(h);
  const rels=D.rels.filter(r=>r.a==p.id||r.b==p.id);if(!rels.length){const e=document.createElement('div');e.className='empty';e.textContent='None yet';el.append(e)}
  for(const r of rels){const o=person(r.a==p.id?r.b:r.a);if(!o)continue;const d=document.createElement('div');d.className='rel';
    const kind=r.t=='s'?'Partner':r.a==p.id?'Child':'Parent';d.append(kind+': '+(o.name||'Unnamed'));
    const x=document.createElement('button');x.textContent='×';x.title='Remove connection';x.onclick=()=>{D.rels=D.rels.filter(q=>q!==r);save();render()};d.append(x);el.append(d)}
  const qa=document.createElement('div');qa.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-top:10px';
  for(const[k,l]of[['parent','Add parent'],['partner','Add partner'],['child','Add child'],['sibling','Add sibling']]){const b=document.createElement('button');b.textContent=l;b.onclick=()=>quickAdd(k);qa.append(b)}
  const cb=document.createElement('button');cb.textContent='Connect two people';cb.onclick=()=>{conn=conn==p.id?null:p.id;panel()};qa.append(cb);el.append(qa);
  if(conn==p.id){const box=document.createElement('div');box.style.cssText='margin-top:8px;padding:8px;border:1px solid var(--bd);border-radius:6px';
    const others=D.people.filter(q=>q!==p).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    if(!others.length)box.textContent='Add another person first.';else{
      const s1=document.createElement('select'),s2=document.createElement('select');s1.style.cssText=s2.style.cssText='width:100%;margin:3px 0;padding:5px';
      others.forEach(q=>s1.add(new Option((q.name||'Unnamed')+(q.born?' ('+q.born+')':''),q.id)));
      [['p','is a parent of'],['c','is a child of'],['s','is a partner of']].forEach(([v,l])=>s2.add(new Option(l,v)));
      const nm=document.createElement('div');nm.textContent=p.name||'Unnamed';nm.style.fontWeight='600';
      const go=document.createElement('button');go.textContent='Connect';go.style.marginTop='4px';
      go.onclick=()=>{const o=s1.value,t=s2.value,ok=t=='p'?addLink('p',o,p.id):t=='c'?addLink('p',p.id,o):addLink('s',p.id,o);
        if(!ok){st('Those two are already connected that way.');return}conn=null;save();render()};
      box.append(s1,s2,nm,go)}
    el.append(box)}
  const del=document.createElement('button');del.textContent='Delete person';del.style.cssText='margin-top:14px;color:#b3372b';
  del.onclick=()=>{if(!del.dataset.arm){del.dataset.arm='1';del.textContent='Click again to confirm delete';setTimeout(()=>{del.dataset.arm='';del.textContent='Delete person'},3000);return}
    D.people=D.people.filter(q=>q!==p);D.rels=D.rels.filter(r=>r.a!=p.id&&r.b!=p.id);sel=null;conn=null;save();render()};el.append(del)}

// ---- interaction ----
function addLink(t,a,b){if(a==b||D.rels.some(r=>r.t==t&&((r.a==a&&r.b==b)||(t=='s'&&r.a==b&&r.b==a))))return false;D.rels.push({t,a,b});return true}
function link(d){let a,b,t='p';if(d.port=='b')[a,b]=[d.from,d.to];else if(d.port=='t')[a,b]=[d.to,d.from];else{a=d.from;b=d.to;t='s'}
  if(addLink(t,a,b))save();render()}
// place a new person near (x,y), shifting right until the spot is free
function spawn(x,y,name){const n={id:uid(),name,x,y};while(D.people.some(q=>Math.abs(q.x-n.x)<W+20&&Math.abs(q.y-n.y)<H+20))n.x+=200;D.people.push(n);return n}
function quickAdd(kind){const p=person(sel);let n;
  if(kind=='partner'){n=spawn(p.x+200,p.y,'New partner');addLink('s',p.id,n.id)}
  else if(kind=='parent'){const ex=D.rels.filter(r=>r.t=='p'&&r.b==p.id).map(r=>person(r.a)).filter(Boolean);
    n=ex.length==1?spawn(ex[0].x+200,ex[0].y,'New parent'):spawn(p.x,p.y-160,'New parent');addLink('p',n.id,p.id);
    if(ex.length==1)addLink('s',ex[0].id,n.id)} // second parent is partnered with the first
  else if(kind=='child'){n=spawn(p.x,p.y+160,'New child');addLink('p',p.id,n.id);
    const ps=D.rels.filter(r=>r.t=='s'&&(r.a==p.id||r.b==p.id));if(ps.length==1)addLink('p',ps[0].a==p.id?ps[0].b:ps[0].a,n.id)} // a single partner becomes co-parent
  else{let par=D.rels.filter(r=>r.t=='p'&&r.b==p.id).map(r=>r.a);
    if(!par.length){const q=spawn(p.x,p.y-160,'Unknown parent');addLink('p',q.id,p.id);par=[q.id]}
    n=spawn(p.x+200,p.y,'New sibling');par.forEach(a=>addLink('p',a,n.id))}
  sel=n.id;conn=null;save();render()}
stage.onpointerdown=e=>{const port=e.target.closest('.port'),node=e.target.closest('.node');
  if(port)drag={m:'link',from:node.dataset.id,port:port.dataset.p};
  else if(node){const p=person(node.dataset.id),w=toW(e);drag={m:'move',id:p.id,dx:w[0]-p.x,dy:w[1]-p.y};sel=p.id;stage.querySelectorAll('.node.sel').forEach(n=>n.classList.remove('sel'));node.classList.add('sel');panel()}
  else{drag={m:'pan',sx:e.clientX-V.x,sy:e.clientY-V.y};if(sel){sel=null;render()}}
  stage.setPointerCapture(e.pointerId);stage.style.cursor='grabbing'};
stage.onpointermove=e=>{if(!drag)return;
  if(drag.m=='pan'){V.x=e.clientX-drag.sx;V.y=e.clientY-drag.sy;view()}
  else if(drag.m=='move'){const w=toW(e),p=person(drag.id);p.x=Math.round((w[0]-drag.dx)/G)*G;p.y=Math.round((w[1]-drag.dy)/G)*G;drag.moved=1;
    const n=world.querySelector(`[data-id="${p.id}"]`);n.style.left=p.x+'px';n.style.top=p.y+'px';lines()}
  else{world.querySelectorAll('.hot').forEach(n=>n.classList.remove('hot'));let end=toW(e);drag.to=null;
    const el=document.elementFromPoint(e.clientX,e.clientY),tn=el&&el.closest('.node');
    if(tn&&tn.dataset.id!=drag.from){tn.classList.add('hot');drag.to=tn.dataset.id;end=pos(drag.to,{t:'b',b:'t',l:'r',r:'l'}[drag.port])} // snap to target port
    const s=pos(drag.from,drag.port);tmp.setAttribute('d',`M${s[0]} ${s[1]}L${end[0]} ${end[1]}`)}};
stage.onpointerup=()=>{if(!drag)return;const d=drag;drag=null;tmp.setAttribute('d','');stage.style.cursor='';
  if(d.m=='move'&&d.moved)save();else if(d.m=='link'){if(d.to)link(d);else render()}};
stage.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY)};
$('#zi').onclick=()=>zoom(1.25);$('#zo').onclick=()=>zoom(.8);$('#fit').onclick=fit;
$('#add').onclick=()=>{const r=stage.getBoundingClientRect(),c=[(r.width/2-V.x)/V.k,(r.height/2-V.y)/V.k];
  const p={id:uid(),name:'New person',x:Math.round((c[0]-W/2)/G)*G,y:Math.round((c[1]-H/2)/G)*G};D.people.push(p);sel=p.id;save();render()};
$('#pf').onchange=e=>{const f=e.target.files[0],p=person(sel);if(!f||!p)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=140;
  const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,140,140);p.photo=c.toDataURL('image/jpeg',.7);save();render()};
  im.src=URL.createObjectURL(f);e.target.value=''};
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='tree.json';a.click()};
$('#im').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.people||!j.rels)throw 0;D=j;sel=null;save();render();fit()}catch{st('Not a valid tree.json')}e.target.value=''};
addEventListener('keydown',e=>{if(e.key=='Escape'){sel=null;render()}});
view();panel();
</script></body></html>
